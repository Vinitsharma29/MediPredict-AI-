services:
  mysql:
    image: mysql:8.0
    container_name: medipredict-mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medipredict
      MYSQL_USER: medipredict
      MYSQL_PASSWORD: medipredict
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    container_name: medipredict-backend
    environment:
      APP_ENV: production
      DATABASE_URL: "mysql+pymysql://medipredict:medipredict@mysql:3306/medipredict"
      JWT_SECRET: "change-me-in-production"
      FIELD_ENC_KEY: "change-me-in-production"
      CORS_ORIGINS: "http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build: ./frontend
    container_name: medipredict-frontend
    environment:
      VITE_API_BASE: "http://localhost:8000"
    ports:
      - "5173:5173"
    depends_on:
      - backend

